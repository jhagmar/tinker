name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tinker-backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy, llvm-tools-preview
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tinker-backend
      - name: Install cargo-llvm-cov and cargo-deny
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-llvm-cov,cargo-deny
      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path catalog/Cargo.toml -- --check
      - name: Clippy
        run: |
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo clippy --manifest-path catalog/Cargo.toml --locked --all-targets -- -D warnings
      - name: Layering
        run: python3 scripts/layering.py
      - name: Deny
        run: cargo deny check
      - name: Test
        run: cargo test --workspace --locked
      - name: Coverage
        run: cargo llvm-cov --workspace --locked --fail-under-lines 100 --lcov --output-path lcov.info --ignore-filename-regex '/main\.rs$'
      - name: Compose
        working-directory: .
        run: docker compose -f tinker-backend/compose/docker-compose.yml config
      - name: Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: tinker-backend/lcov.info
          fail_ci_if_error: false
